<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Image Gallery</h1>

    <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="city">City</button>
        <button data-filter="animals">Animals</button>
    </div>

    <div class="gallery">

        <div class="gallery-item animals">
            <img src="Gallery/Animal-1.jpeg" alt="Animal 1">
        </div>

        <div class="gallery-item animals">
            <img src="Gallery/Animal-2.jpg" alt="Animal 2">
        </div>

        <div class="gallery-item animals">
            <img src="Gallery/Animal-3.jpeg" alt="Animal 3">
        </div>

        <div class="gallery-item animals">
            <img src="Gallery/Animal-4.webp" alt="Animal 4">
        </div>

        <div class="gallery-item animals">
            <img src="Gallery/Animal-5.webp" alt="Animal 5">
        </div>

        <div class="gallery-item city">
            <img src="Gallery/city-1.jpeg" alt="City 1">
        </div>

        <div class="gallery-item city">
            <img src="Gallery/city-2.jpeg" alt="City 2">
        </div>

        <div class="gallery-item city">
            <img src="Gallery/city-3.jpeg" alt="City 3">
        </div>

        <div class="gallery-item city">
            <img src="Gallery/city-4.jpeg" alt="City 4">
        </div>
        <div class="gallery-item nature">
            <img src="Gallery/nature-5.jpeg" alt="Nature 5">
        </div>
        <div class="gallery-item city">
            <img src="Gallery/city-5.jpeg" alt="City 5">
        </div>

        <div class="gallery-item nature">
            <img src="Gallery/nature-1.jpeg" alt="Nature 1">
        </div>

        <div class="gallery-item nature">
            <img src="Gallery/nature-2.jpeg" alt="Nature 2">
        </div>

        <div class="gallery-item nature">
            <img src="Gallery/nature-3.jpeg" alt="Nature 3">
        </div>

        <div class="gallery-item nature">
            <img src="Gallery/nature-4.jpeg" alt="Nature 4">
        </div>

        <div class="gallery-item nature">
            <img src="Gallery/nature-5.jpeg" alt="Nature 5">
        </div>



    </div>

    <div class="lightbox">
        <span class="close">&times;</span>
        <button class="prev">&#10094;</button>
        <img class="lightbox-img" src="" alt="Lightbox View">
        <button class="next">&#10095;</button>
    </div>

    <script src="main.js"></script>
</body>

</html>
